[project]
name = "backend"
version = "0.1.0"
description = "Flask backend"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gunicorn>=26.0.0",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myapp"]
